<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPSC CSE Prelims - Dhwani AI Teacher | Eprashala</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Marked.js for AI Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> 
	<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <style type="text/tailwindcss">
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap');
        
        :root { 
            --chat-font-size: 14px; 
        }

        body { 
            font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; 
            background-color: #020617; 
            color: #f8fafc;
            touch-action: manipulation;
        }

        .cinzel { font-family: 'Cinzel', serif; }

        .glass-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .custom-select, .custom-input {
            @apply bg-slate-900 border border-slate-700 rounded-xl p-2.5 outline-none transition-all text-sky-400 text-sm font-semibold;
        }
        .custom-select:focus, .custom-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .option-card {
            @apply flex items-start gap-3 p-4 rounded-xl border border-slate-700/80 bg-slate-900/60 hover:bg-slate-800/80 transition-all cursor-pointer text-left text-sm text-slate-200;
        }
        .option-card.correct {
            @apply bg-emerald-950/60 border-emerald-500 text-emerald-200 shadow-[0_0_15px_rgba(16,185,129,0.2)];
        }
        .option-card.wrong {
            @apply bg-rose-950/60 border-rose-500 text-rose-200 shadow-[0_0_15px_rgba(244,63,94,0.2)];
        }
        .option-card.disabled {
            @apply pointer-events-none opacity-80;
        }

        .big-mic {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            transition: all 0.2s ease;
        }
        .big-mic:active { transform: scale(0.94); }

        .mic-listening { 
            animation: pulse-ring 1.5s infinite; 
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%) !important;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .markdown-body strong { color: #38bdf8; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .markdown-body p { margin-bottom: 0.5rem; }
    </style>
</head>

<body class="fixed inset-0 flex flex-col items-center justify-between overflow-hidden bg-[radial-gradient(ellipse_at_top,#0f172a_0%,#020617_100%)] w-full">

<!-- START MODAL OVERLAY (TRICOLOUR THEME) -->
    <div id="start-overlay" class="fixed inset-0 z-50 bg-[#020617] flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 rounded-full border-4 border-blue-800 flex items-center justify-center text-3xl mb-4 shadow-[0_0_20px_rgba(30,58,138,0.5)] bg-white">
            <span class="animate-spin-slow" style="animation: spin 10s linear infinite;">☸️</span>
        </div>
        <div class="text-xs uppercase tracking-widest text-orange-400 font-semibold mb-2">Eprashala UPSC AI Platform</div>
        <h1 class="text-3xl cinzel font-bold text-white mb-3"><span class="text-orange-500">UPSC CSE</span> Prelims Mentor</h1>
        <p class="text-slate-400 text-sm max-w-md mb-8">Master Previous Years' Questions with Dhwani AI Teacher. Instant conceptual guidance and personalized doubt resolution.</p>
        <button id="btn-start" class="px-8 py-3.5 bg-gradient-to-r from-orange-500 via-white to-green-600 text-slate-900 font-extrabold rounded-xl shadow-[0_0_15px_rgba(255,255,255,0.2)] transition-all transform active:scale-95 outline-none">
            ENTER CLASSROOM
        </button>
    </div>

 <!-- CROP MODAL (HIDDEN BY DEFAULT) -->
    <div id="crop-modal" class="hidden fixed inset-0 bg-black z-[200] flex flex-col">
        <div class="flex-1 overflow-hidden relative bg-black flex items-center justify-center">
            <img id="crop-image" class="max-w-full block" src="">
        </div>
        <div class="h-20 bg-slate-900 flex justify-between items-center px-6 border-t border-slate-700 pb-safe">
            <button id="btn-crop-retake" class="text-rose-400 font-bold py-3 px-4 rounded-xl active:bg-slate-800 transition-colors outline-none tracking-wide">RETAKE</button>
            <button id="btn-crop-done" class="bg-sky-600 text-white font-bold py-3 px-8 rounded-xl active:bg-sky-700 transition-colors shadow-[0_0_15px_rgba(2,132,199,0.4)] outline-none tracking-wide">DONE</button>
        </div>
    </div>

     <!-- HIDDEN GALLERY INPUT -->
    <input type="file" id="camera-input" accept="image/*" class="hidden">
	
   <!-- MAIN APP CONTAINER -->
    <div class="w-full max-w-4xl h-full flex flex-col justify-between relative shadow-2xl overflow-hidden">
        
<!-- HEADER CONTROL BAR (TRICOLOUR ACCENTS) -->
        <header class="p-3 sm:p-4 glass-card rounded-b-2xl z-20 flex-shrink-0 border-t-4 border-t-orange-500 border-b-4 border-b-green-600 shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
            <div class="flex items-center justify-between gap-3 mb-3">
                <div class="flex items-center gap-2">
                    <span class="text-white text-xl font-bold cinzel tracking-wide">UPSC</span>
                    <span class="text-[10px] bg-blue-900 text-white px-2 py-0.5 rounded border border-blue-700 font-bold uppercase tracking-wider">Prelims</span>
                </div>
                <div class="flex items-center gap-3">
                    <button id="btn-settings-open" class="text-slate-400 hover:text-white p-1.5 rounded-lg bg-slate-800 border border-slate-700 outline-none">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </button>
                </div>
            </div>

            <!-- The 3 Core Dropdowns -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 items-center mb-3">
                <select id="lang-selector" class="custom-select w-full !py-1.5 text-xs font-bold text-orange-400 border-orange-500/30">
                    <option value="en">Language: English</option>
                    <option value="hi">भाषा: हिन्दी</option>
                </select>
                <select id="year-selector" class="custom-select w-full !py-1.5 text-xs font-bold text-white border-slate-600">
                    <!-- Populated via JS 2026 to 2000 -->
                </select>
                <select id="paper-type-selector" class="custom-select w-full !py-1.5 text-xs font-bold text-green-400 border-green-500/30">
                    <option value="GS1">General Studies Paper - I</option>
                    <option value="GS2">General Studies Paper - II (CSAT)</option>
                </select>
            </div>

			<div class="flex items-center justify-between gap-3 px-1 border-t border-slate-700/50 pt-2">
			<label class="flex items-center gap-1.5 cursor-pointer select-none">
				<input
					type="checkbox"
					id="random-checkbox"
					class="w-4 h-4 accent-orange-500 rounded bg-slate-900 border-slate-700"
					checked
				>
				<span class="text-[10px] sm:text-xs font-medium text-slate-300 whitespace-nowrap" id="lbl-random">
					Shuffle
				</span>
			</label>
                
                <button id="btn-start-exam" class="px-5 py-1.5 bg-gradient-to-r from-orange-500 via-white to-green-600 text-slate-900 font-extrabold rounded-lg shadow-lg text-xs hover:opacity-90 transition-opacity outline-none">
                    START EXAM
                </button>

                <div class="flex items-center gap-2">
                    <span id="exam-timer" class="text-xs bg-slate-900 text-white px-2.5 py-1 rounded-full border border-orange-500 font-bold shadow-[0_0_8px_rgba(249,115,22,0.4)] tracking-wider w-16 text-center">
                        00:00
                    </span>
                    <span id="score-counter" class="text-xs bg-slate-900 text-white px-2.5 py-1 rounded-full border border-green-600 font-bold shadow-[0_0_8px_rgba(22,163,74,0.4)]">
                        Score: 0
                    </span>
                </div>
            </div>
        </header>

        <!-- MAIN SCROLLABLE CONTENT (QUESTION + DHWANI TUTOR LOG) -->
        <main class="flex-1 overflow-y-auto px-4 py-3 space-y-4" id="main-scroll-area">
            
            <!-- QUESTION CARD -->
            <div id="question-card" class="glass-card rounded-2xl p-5 border border-sky-500/20 shadow-xl transition-all">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-400 mb-3 border-b border-slate-700/60 pb-2">
                    <span id="q-index-badge" class="text-sky-400 font-bold uppercase tracking-wider">Question 1</span>
                    <span id="q-subject-badge" class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded border border-slate-700">Polity</span>
                </div>
                
                <div id="q-statement" class="text-sm md:text-base font-medium leading-relaxed text-slate-100 mb-5 whitespace-pre-line">
                    Loading question...
                </div>

                <div id="options-container" class="grid grid-cols-1 gap-2.5">
                    <!-- Options populated via JS -->
                </div>
            </div>

            <!-- DHWANI AI INTERACTION & DIALOGUE LOG -->
            <div id="dhwani-mentor-box" class="hidden glass-card rounded-2xl p-4 border border-sky-500/30 bg-[#071126]/90 transition-all">
                <div class="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
                        <span class="text-xs font-bold uppercase tracking-wider text-orange-400 cinzel">Dhwani AI Teacher</span>
                    </div>

                </div>

                <div id="dhwani-explanation" class="text-sm leading-relaxed text-slate-200 markdown-body"></div>

                <!-- Follow-up Doubts Action Bar -->
                <div id="doubt-action-bar" class="mt-4 pt-3 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
				<button id="btn-ask-dhwani-ias" class="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sky-300 text-xs font-bold rounded-xl transition-all border border-sky-500/30 outline-none shadow-inner active:scale-95">
					<svg class="w-4 h-4 text-sky-400 animate-pulse" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
					<span id="lbl-understanding-prompt">Have a Doubt? Ask Dhwani AI Teacher</span>
				</button>
                    <button id="btn-next-question" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold rounded-xl transition-all shadow-md">
                        Proceed to Next Question →
                    </button>
                </div>
            </div>

            <!-- CONVERSATIONAL DOUBT LOG CONTAINER -->
            <div id="chat-stream" class="space-y-3"></div>
        </main>

	    <!-- FOOTER / VOICE, TEXT & CAMERA DOUBT RESOLUTION INPUT (MOBILE OPTIMIZED) -->
        <footer class="p-2 sm:p-3 glass-card rounded-t-2xl z-20 flex-shrink-0 w-full" style="padding-bottom: max(env(safe-area-inset-bottom), 12px);">
            <div class="flex items-center gap-1 sm:gap-2">
                <button id="btn-export-pdf" class="p-1.5 sm:p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full text-slate-400 hover:text-sky-400 transition-all flex-shrink-0 outline-none shadow-inner" title="Export Entire Session to PDF">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                </button>

                <button id="btn-camera" class="p-1.5 sm:p-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full text-slate-400 hover:text-orange-400 transition-all flex-shrink-0 outline-none shadow-inner" title="Snap Textbook Page or Upload Image">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>

                <input type="text" id="user-doubt-input" class="custom-input flex-1 !text-[11px] sm:!text-sm rounded-full px-3 py-2 sm:py-2.5 placeholder-slate-500" placeholder="Ask Dhwani AI...">
                
                <button id="btn-voice-mic" class="big-mic w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center flex-shrink-0 text-white outline-none" title="Speak to Dhwani AI">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
                </button>

                <button id="btn-send-doubt" class="p-1.5 sm:p-2.5 bg-blue-700 hover:bg-blue-600 rounded-full text-white transition-all flex-shrink-0" title="Send Question">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- SETTINGS & HISTORY MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="glass-card bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm relative overflow-hidden shadow-2xl">
            <button id="btn-settings-close" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl z-20 outline-none">✕</button>

            <!-- MAIN SETTINGS VIEW -->
            <div id="settings-main-view" class="w-full transition-all duration-300">
                <h2 class="text-lg font-bold text-orange-400 cinzel mb-4">Classroom Settings</h2>
                
                <div class="space-y-4 text-xs max-h-[50vh] overflow-y-auto pr-2">
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold uppercase">Candidate Name</label>
                        <input type="text" id="cfg-user-name" class="custom-input w-full !py-2" placeholder="e.g. Aspirant">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold uppercase">Custom Eprashala API Key (Optional)</label>
                        <input type="password" id="cfg-custom-key" class="custom-input w-full !py-2" placeholder="Paste custom API key">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-semibold uppercase">Voice Speed</label>
                        <input type="range" id="cfg-tts-speed" min="0.7" max="1.5" step="0.1" value="1.0" class="w-full accent-orange-500">
                    </div>
                    <div class="flex items-center gap-3 pt-2">
                        <input type="checkbox" id="remember-checkbox" checked class="w-5 h-5 accent-orange-500 rounded cursor-pointer">
                        <label for="remember-checkbox" class="text-sm text-slate-300 cursor-pointer font-bold">Save Exam History locally</label>
                    </div>
					<div class="flex items-center gap-3">
                            <input type="checkbox" id="highlight-checkbox" class="w-5 h-5 accent-orange-500 rounded cursor-pointer">
                            <label for="highlight-checkbox" class="text-sm text-slate-300 cursor-pointer font-bold">Show Text Highlights (TTS)</label>
                    </div>
                </div>

                <div class="mt-5 pt-4 border-t border-slate-700/50 space-y-3">
                    <button id="btn-view-history" class="w-full bg-slate-800 hover:bg-slate-700 text-orange-400 text-xs font-bold py-2.5 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 outline-none border border-slate-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Past Exam Sessions
                    </button>

                    <button id="btn-update-app" class="w-full bg-blue-800 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-xl transition-all shadow-md flex items-center justify-center gap-2 outline-none border border-blue-600" title="Force download of latest papers and app files">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Sync Latest Updates
                    </button>
                </div>

                <div class="mt-4 flex justify-end">
                    <button id="btn-settings-save" class="w-full py-2 bg-orange-600 hover:bg-orange-500 rounded-xl text-white font-bold text-xs transition-colors shadow-md">Save Changes & Close</button>
                </div>
            </div>

            <!-- HISTORY ARCHIVE VIEW -->
            <div id="settings-history-view" class="hidden w-full h-[65vh] flex-col transition-all duration-300">
                <div class="flex items-center mb-4 border-b border-slate-700/50 pb-3">
                    <button id="btn-history-back" class="text-slate-400 hover:text-orange-400 mr-3 outline-none transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <h2 class="text-lg font-bold text-orange-400 cinzel m-0">Exam Archives</h2>
                </div>
                <div id="history-list-container" class="flex-1 overflow-y-auto space-y-2 pr-2">
                    <!-- Dynamic List -->
                </div>
            </div>
        </div>
    </div>


    <script src="UPSC.js"></script>
	<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('Service Worker registered successfully with scope:', registration.scope);
                })
                .catch((error) => {
                    console.error('Service Worker registration failed:', error);
                });
        });
    }
    </script>
</body>
</html>
