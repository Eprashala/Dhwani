<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eprashala Custom AI Library</title>
    <script src="tailwind.js"></script>
    <script src="marked.min.js"></script>
    <script src="html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap');
        :root { --chat-font-size: 14px; }
        body { font-family: 'Inter', sans-serif; background-color: #020617; user-select: none; }
        h1, .cinzel { font-family: 'Cinzel', serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-input { width: 100%; border: 1px solid #475569; border-radius: 0.75rem; padding: 0.75rem; background-color: rgba(2, 6, 23, 0.85); color: #fde047; outline: none; }
        .big-mic { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); box-shadow: 0 10px 25px rgba(2, 132, 199, 0.5); cursor: pointer; transition: all 0.2s ease; }
        .big-mic:active { transform: scale(0.92); }
        .mic-pulse { animation: ripple 1.5s infinite; background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%) !important; }
        .mic-thinking { animation: pulse-think 1.5s infinite; background: linear-gradient(135deg, #ca8a04 0%, #854d0e 100%) !important; }
        @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        @keyframes pulse-think { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.95); } }
        .markdown-body strong { color: #fde047; }
    </style>
</head>

<body class="text-white flex flex-col items-center h-screen overflow-hidden">

    <!-- UPLOAD PDF MODAL DIALOG -->
    <div id="uploadModal" class="fixed inset-0 bg-black/85 z-50 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-cyan-500/40 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
            <button id="btn-close-upload-modal" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
            <h2 class="text-xl font-bold text-cyan-400 mb-1 cinzel">Upload Custom Textbook</h2>
            <p class="text-xs text-slate-400 mb-5">The book will be indexed on our server for teacher interaction.</p>

            <form id="uploadBookForm" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-300 font-bold mb-1">1. Book Name / Title</label>
                    <input type="text" id="form-book-title" required class="custom-input text-sm" placeholder="e.g. 10th Science Part 1">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-300 font-bold mb-1">2. Author / Board</label>
                    <input type="text" id="form-book-author" required class="custom-input text-sm" placeholder="e.g. Balbharati / NCERT">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-300 font-bold mb-1">3. Edition / Year</label>
                    <input type="text" id="form-book-edition" class="custom-input text-sm" placeholder="e.g. 2024 Revised Edition">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-300 font-bold mb-1">4. Primary Language</label>
                    <select id="form-book-lang" class="custom-input text-sm font-bold">
                        <option value="mr-IN" selected>🇮🇳 Marathi (मराठी)</option>
                        <option value="hi-IN">🇮🇳 Hindi (हिन्दी)</option>
                        <option value="en-IN">🇬🇧 English</option>
                        <option value="gu-IN">🇮🇳 Gujarati</option>
                        <option value="sa-IN">🇮🇳 Sanskrit</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-300 font-bold mb-1">5. Select PDF File</label>
                    <input type="file" id="form-book-file" accept="application/pdf" required class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-cyan-900 file:text-cyan-200 hover:file:bg-cyan-800 cursor-pointer">
                </div>

                <button type="submit" id="btn-submit-upload" class="w-full mt-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-3 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
                    <span id="upload-btn-text">Extract & Index on Server</span>
                    <svg id="upload-spinner" class="w-4 h-4 animate-spin hidden" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN INTERFACE -->
    <div class="flex flex-col w-full h-full max-w-2xl relative shadow-2xl">
        <header class="flex-shrink-0 pt-4 pb-4 px-4 glass-panel z-20 rounded-b-3xl relative">
            <div class="flex justify-between items-center mb-3">
                <a href="index.html" class="text-xs text-slate-400 hover:text-yellow-400 flex items-center gap-1 font-bold">
                    <span>← Ancient Library</span>
                </a>
                <button id="btn-open-upload-modal" class="px-3 py-1.5 bg-gradient-to-r from-yellow-600 to-amber-600 hover:from-yellow-500 hover:to-amber-500 text-white text-xs font-bold rounded-xl shadow-md flex items-center gap-1.5 transition-transform active:scale-95">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    <span>Upload New Book</span>
                </button>
            </div>

            <h1 class="text-xl font-bold tracking-widest text-center uppercase cinzel">
                <span class="text-cyan-400">Dhwani</span> <span class="text-yellow-400">AI Teacher</span>
            </h1>

            <!-- Book Dropdown Selector -->
            <div class="w-full mt-3">
                <label class="block text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-1">Select Active Textbook:</label>
                <select id="server-books-dropdown" class="custom-input !py-2.5 text-sm font-bold cursor-pointer">
                    <option value="">-- Loading server textbooks... --</option>
                </select>
            </div>
        </header>

        <main id="conversation-log" class="flex-1 overflow-y-auto p-4 space-y-4 pb-12 scroll-smooth">
            <div class="text-gray-400 text-center mt-12 cinzel" id="welcome-msg">
                <p class="text-cyan-400 text-2xl mb-2">📚 Select or Upload a Book 📚</p>
                Dhwani AI Teacher will answer strictly according to the pages of the selected textbook.
            </div>
        </main>

        <footer class="w-full glass-panel rounded-t-3xl p-3 flex flex-col flex-shrink-0 z-20 shadow-2xl">
            <div class="w-full flex gap-2 items-center mb-2">
                <input type="text" id="text-input" class="custom-input text-sm rounded-full px-5 py-3" placeholder="Ask a question from the book...">
                <button id="btn-send" class="p-3.5 bg-cyan-700 hover:bg-cyan-600 rounded-full transition-colors shadow-lg">
                    <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>

            <div class="w-full flex items-center justify-center gap-3">
                <button id="btn-mic" class="big-mic w-12 h-12 rounded-full flex items-center justify-center outline-none">
                    <svg id="icon-mic" class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
                </button>
                <button id="btn-stop" class="p-2.5 text-red-400 hover:text-red-300 rounded-full bg-slate-800/80 border border-slate-700" title="Stop Audio">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- SCRIPT FOR CUSTOM CONTROLLER -->
    <script src="intry3_custom.js"></script>
</body>
</html>
